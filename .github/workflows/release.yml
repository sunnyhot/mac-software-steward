name: Release macOS App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing Mac 软件管家 version: $VERSION"

      - name: Update version in package.json
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json')); p.version='${{ steps.version.outputs.version }}'; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');"

      - name: Update version in Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" native/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.version.outputs.version }}" native/Info.plist

      - name: Run native tests
        run: |
          chmod +x scripts/test-native.sh
          npm test

      - name: Build macOS App
        run: |
          chmod +x scripts/build-native.sh
          bash scripts/build-native.sh

      - name: Verify build
        run: |
          test -d "build/MacSoftwareSteward.app" || { echo "Build failed"; exit 1; }
          test -x "build/MacSoftwareSteward.app/Contents/MacOS/MacSoftwareSteward" || { echo "Executable not found"; exit 1; }
          echo "Build verified: $(du -sh build/MacSoftwareSteward.app)"

      - name: Package
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release
          /usr/bin/ditto -c -k --norsrc --noextattr --keepParent \
            build/MacSoftwareSteward.app release/MacSoftwareSteward.zip
          cp release/MacSoftwareSteward.zip "release/MacSoftwareSteward-v${VERSION}.zip"
          cd release
          SHA256=$(shasum -a 256 MacSoftwareSteward.zip | awk '{print $1}')
          SIZE=$(stat -f%z MacSoftwareSteward.zip)
          echo "${SHA256}  MacSoftwareSteward.zip" > MacSoftwareSteward.zip.sha256
          shasum -a 256 "MacSoftwareSteward-v${VERSION}.zip" > "MacSoftwareSteward-v${VERSION}.zip.sha256"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "size=${SIZE}" >> "$GITHUB_OUTPUT"
          echo "Package contents:"
          ls -lh

      - name: Generate latest.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          SHA256="${{ steps.package.outputs.sha256 }}"
          SIZE="${{ steps.package.outputs.size }}"
          PUBLISHED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          # release notes 取自 CHANGELOG.md 中本版本段落（## v$VERSION 到下一个 ## 之间），
          # 而非写死文案——避免每个版本都发同一份过长且失真的说明。
          # 若提供了 release/RELEASE_NOTES-v$VERSION.md 则优先用它（便于人工精修特定版本）。
          if [ -f "release/RELEASE_NOTES-v${VERSION}.md" ]; then
            cp "release/RELEASE_NOTES-v${VERSION}.md" release/RELEASE_NOTES.md
          else
            awk -v tag="v${VERSION}" '
              $0 ~ "^## "tag"([ (]|$)" {capture=1; next}
              capture && /^## / {exit}
              capture {print}
            ' CHANGELOG.md > release/RELEASE_NOTES.md
          fi
          # 兜底：CHANGELOG 没匹配到（如格式变动/版本写错）时给最小占位，绝不发空说明。
          if [ ! -s release/RELEASE_NOTES.md ]; then
            { echo "## Mac 软件管家 ${TAG}"; echo ""; echo "详见 CHANGELOG.md。"; } > release/RELEASE_NOTES.md
          fi
          VERSION="${VERSION}" \
          TAG="${TAG}" \
          SHA256="${SHA256}" \
          SIZE="${SIZE}" \
          PUBLISHED_AT="${PUBLISHED_AT}" \
          NOTES_FILE="release/RELEASE_NOTES.md" \
          OUT_FILE="release/latest.json" \
          node <<'NODE'
          const fs = require('fs');

          const manifest = {
            version: process.env.VERSION,
            tag: process.env.TAG,
            asset: 'MacSoftwareSteward.zip',
            sha256: process.env.SHA256,
            size: Number(process.env.SIZE || 0),
            published_at: process.env.PUBLISHED_AT,
            notes: fs.readFileSync(process.env.NOTES_FILE, 'utf8').trim(),
            download_url: `https://github.com/sunnyhot/mac-software-steward/releases/download/${process.env.TAG}/MacSoftwareSteward.zip`,
            html_url: `https://github.com/sunnyhot/mac-software-steward/releases/tag/${process.env.TAG}`
          };

          fs.writeFileSync(process.env.OUT_FILE, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          echo "Generated latest.json:"
          cat release/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Mac 软件管家 ${{ steps.version.outputs.tag }}
          body_path: release/RELEASE_NOTES.md
          files: |
            release/MacSoftwareSteward.zip
            release/MacSoftwareSteward.zip.sha256
            release/MacSoftwareSteward-v${{ steps.version.outputs.version }}.zip
            release/MacSoftwareSteward-v${{ steps.version.outputs.version }}.zip.sha256
            release/latest.json
          draft: false
          prerelease: false
